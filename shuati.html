var groupSize=30, currentSet=[], ci=0, ad={}, roundDone=false, totalCorrect=0, totalDone=0, historyWrong=[];

function selNum(n,el){
  document.querySelectorAll('.num-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  groupSize=n;
}

function startRound(){
  document.getElementById('setup').style.display='none';
  document.getElementById('tabs').style.display='flex';
  newRound();
}

function newRound(){
  var pool=[...Array(Q.length).keys()].filter(i=>ad[i]===undefined);
  if(pool.length===0){alert('🎉 题库已刷完！所有题都做过了。');resetAll();return}
  var n=groupSize||pool.length;
  n=Math.min(n,pool.length);
  var chosen=[];
  for(var i=0;i<n;i++){
    var r=Math.floor(Math.random()*pool.length);
    chosen.push(pool.splice(r,1)[0]);
  }
  currentSet=chosen;ci=0;roundDone=false;totalCorrect=0;totalDone=0;
  document.getElementById('sb').style.display='none';
  render();
}

function resetAll(){
  ad={};historyWrong=[];groupSize=30;
  document.getElementById('setup').style.display='block';
  document.getElementById('tabs').style.display='none';
  document.getElementById('qa').innerHTML='';
  document.getElementById('sb').style.display='none';
}

function render(){
  if(roundDone){showResult();return}
  var t=currentSet.length;
  if(ci>=t){
    roundDone=true;
    totalCorrect=currentSet.filter(i=>ad[i]===true).length;
    totalDone=currentSet.filter(i=>ad[i]!==undefined).length;
    currentSet.filter(i=>ad[i]===false).forEach(i=>{if(!historyWrong.includes(i))historyWrong.push(i)});
    showResult();return
  }
  document.getElementById('sb').style.display='none';
  var idx=currentSet[ci], q=Q[idx], ua=ad[idx], done=ad[idx]!==undefined, isMulti=Array.isArray(q.ans);
  var h='<div class="card"><div class="num">第'+(ci+1)+'/'+t+'题 ｜ 题库第'+(idx+1)+'题</div>';
  if(isMulti)h+='<div class="multihint">🔢 多选题</div>';
  h+='<div class="txt">'+q.q+'</div>';
  q.opts.forEach((o,i)=>{
    var cls='opt';
    if(done){
      if(Array.isArray(q.ans)){
        if(q.ans.includes(i))cls+=' correct';
        else if(ua&&ua.includes&&ua.includes(i)&&!q.ans.includes(i))cls+=' wrong';
        else cls+=' show-correct';
      }else{
        if(i===q.ans)cls+=' correct';
        else if(typeof ua==='number'&&ua===i&&ua!==q.ans)cls+=' wrong';
        else if(typeof ua==='number')cls+=' show-correct';
      }
    }
    h+='<div class="'+cls+'" onclick="ans('+ci+','+i+')">'+String.fromCharCode(65+i)+'. '+o+'</div>';
  });
  h+='<div class="exp'+(done?' show':'')+'" id="e'+ci+'">💡 '+q.exp+'</div>';
  if(done)h+='<button class="btn btn-next" onclick="ci++;render()">下一题 →</button>';
  h+='</div>';
  document.getElementById('qa').innerHTML=h;
}

function ans(pos,chosen){
  var idx=currentSet[pos];
  if(ad[idx]!==undefined)return;
  var q=Q[idx],correct;
  if(Array.isArray(q.ans)){
    if(!ad._multi)ad._multi={};
    if(!ad._multi[idx])ad._multi[idx]=[];
    ad._multi[idx].push(chosen);
    if(ad._multi[idx].length===q.ans.length){
      var s=new Set(ad._multi[idx]);
      correct=q.ans.every(a=>s.has(a))&&ad._multi[idx].length===q.ans.length;
      ad[idx]=correct;
    }else{render();return}
  }else{
    correct=(chosen===q.ans);ad[idx]=correct;
  }
  document.getElementById('e'+pos).classList.add('show');
  render();
}

function showResult(){
  var t=currentSet.length, c=totalCorrect;
  var pct=Math.round(c/t*100);
  var stars=pct>=90?'⭐⭐⭐⭐⭐':pct>=80?'⭐⭐⭐⭐':pct>=70?'⭐⭐⭐':pct>=60?'⭐⭐':'⭐';
  var dots='';
  currentSet.forEach(i=>{
    if(ad[i]===true)dots+='<span class="dot r"></span>';
    else if(ad[i]===false)dots+='<span class="dot w"></span>';
    else dots+='<span class="dot u"></span>';
  });
  var wrongOnes=currentSet.filter(i=>ad[i]===false);
  var h='<div class="result-box"><div class="score">'+c+'</div><div class="sub">共'+t+'题 答对'+c+'题 正确率'+pct+'%</div>';
  h+='<div class="stars">'+stars+'</div><div>'+dots+'</div>';
  if(wrongOnes.length>0){
    h+='<div class="wrong-list"><b>错题回顾（点击查看详情）：</b>';
    wrongOnes.forEach(i=>{
      var q=Q[i];
      h+='<div class="wrong-item" onclick="showOneQ('+i+')">❌ '+q.q.substring(0,50)+'...</div>';
    });
    h+='</div>';
  }
  h+='<br><button class="btn btn-next" onclick="newRound()">🔄 再来一组</button>';
  h+='<button class="btn btn-next" style="background:#fff;color:#2d6aa0;border:2px solid #2d6aa0" onclick="showAll()">🔙 返回首页</button>';
  if(wrongOnes.length>0)h+='<button class="btn btn-next" style="background:#f57c00;color:#fff" onclick="showWrong()">📝 查看错题本</button>';
  h+='</div>';

  var overall=Object.values(ad).filter(v=>v===true).length;
  var overallT=Object.keys(ad).length;
  h+='<div style="text-align:center;font-size:12px;color:#999;padding:8px">累计正确：'+overall+'/'+overallT+' 题</div>';
  document.getElementById('sb').innerHTML=h;
  document.getElementById('sb').style.display='block';
  document.getElementById('qa').innerHTML='';
}

function showOneQ(idx){
  document.getElementById('sb').style.display='none';
  var q=Q[idx],isMulti=Array.isArray(q.ans);
  var h='<div class="card" style="margin:16px"><div class="num">题库第'+(idx+1)+'题</div>';
  h+='<div class="txt">'+q.q+'</div>';
  q.opts.forEach((o,i)=>{
    var cls='opt';
    if(Array.isArray(q.ans)){if(q.ans.includes(i))cls+=' correct'}
    else{if(i===q.ans)cls+=' correct'}
    h+='<div class="'+cls+'">'+String.fromCharCode(65+i)+'. '+o+'</div>';
  });
  h+='<div class="exp show">💡 '+q.exp+'</div>';
  h+='<button class="btn btn-next" onclick="newRound()">🔄 返回刷题</button></div>';
  document.getElementById('qa').innerHTML=h;
}

function showWrong(){
  document.getElementById('sb').style.display='none';
  if(historyWrong.length===0){document.getElementById('qa').innerHTML='<div class="card" style="text-align:center"><h3>🎉 暂无错题！</h3><br><button class="btn btn-next" onclick="newRound()">开始刷题</button></div>';return}
  var h='<div style="padding:10px;font-size:14px;font-weight:bold;color:#f44336">📝 错题本（'+historyWrong.length+'题）</div>';
  historyWrong.forEach(i=>{
    var q=Q[i];
    h+='<div class="wrong-item c" onclick="showOneQ('+i+')">❌ '+q.q.substring(0,60)+'...</div>';
  });
  h+='<br><button class="btn btn-next" style="margin:10px" onclick="newRound()">🔄 继续刷题</button>';
  h+='<button class="btn btn-next" style="margin:10px;background:#fff;color:#2d6aa0;border:2px solid #2d6aa0" onclick="showAll()">🔙 返回首页</button>';
  document.getElementById('qa').innerHTML=h;
}

function showAll(){
  document.getElementById('qa').innerHTML='';
  document.getElementById('sb').style.display='none';
  document.getElementById('setup').style.display='block';
